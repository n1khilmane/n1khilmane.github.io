<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>Nikhil Mane</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital@0;1&display=swap" rel="stylesheet">
<style>
  html,body{height:100%;margin:0;background:#fff;color:#111}
  body{display:flex;align-items:center;justify-content:center;padding:0 24px}
  .line{font:clamp(20px,3.2vw,30px)/1.4 "Courier Prime","Courier New",Courier,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;display:inline-block;width:0;
        border-right:2px solid #111;padding-right:2px;
        animation:type 2.6s steps(29,end) .8s forwards, caret .9s step-end infinite}
  @keyframes type{to{width:29ch}}
  @keyframes caret{50%{border-color:transparent}}
  @media (prefers-reduced-motion:reduce){.line{animation:none;width:auto;border-right:0}}
  @media (max-width:420px){.line{white-space:normal;width:auto;border-right:0;animation:fade 1.2s ease .3s both;text-align:center}
    @keyframes fade{from{opacity:0}to{opacity:1}}}
</style>
</head>
<body>
<p class="line">Work in progress. Stay tuned.</p>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); });
  if (window.caches) { caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); }); }
}
</script>
</body>
</html>
